<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zidane - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="#profile" class="brand">{{ name }} - Portfolio</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_project' %}">Project</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="projects" id="projects">
            <h1>
                My projects
            </h1>

            <div id="project-grid">
                {% for project in project_list %}
                <article class="project-item">
                    <h3>
                        {{ project.name }}
                    </h3>
                    <img src="{{project.image_url}}" alt="mockup of {{project.name}}" class="project-image"
                        width="300" />
                    <p>
                        {{ project.description }}
                    </p>
                    <div class="project-button">
                        <a href="{{ project.project_url }}">
                            <span>Check It Out!</span>
                        </a>
                    </div>
                </article>
                {% endfor %}
            </div>
        </section>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
            </div>
        </footer>
</body>

</html>
